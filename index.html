<!DOCTYPE html>
<!--
Purpose: This page builds on Project 1 by adding a character encoding declaration.
It keeps the page simple while making the setup a little more complete.
-->
<html>
<head>
    <!-- This tells the browser to read the file as UTF-8 text. -->
    <meta charset="UTF-8">

    <!-- The title appears in the browser tab. -->
    <title>Hello</title>
</head>
<body>
    <!-- This heading is the visible page content. -->
    <h1>Hello, world!</h1>
</body>
</html>
